<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نمای شیت - پیگیری پیشرفت دانشجویان</title>
    <script src="assets/libs/tailwindcss.js"></script>
    <link href="assets/fonts/vazirmatn/vazirmatn.css" rel="stylesheet">
    <style>
        * {
            font-family: 'Vazirmatn', sans-serif;
        }
        
        body {
            background: #ffffff;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 8px 12px;
            box-sizing: border-box;
            overflow: hidden;
        }
        
        /* ── دایره وضعیت ───────────────────────── */
        .progress-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .progress-circle:hover { transform: scale(1.15); }

        .progress-circle.completed {
            background: linear-gradient(135deg, #6ee7b7, #a7f3d0);
            color: #065f46;
            box-shadow: 0 3px 10px rgba(110,231,183,0.5);
        }
        .progress-circle.incomplete {
            background: linear-gradient(135deg, #fecaca, #fca5a5);
            color: #7f1d1d;
            box-shadow: 0 3px 10px rgba(252,165,165,0.5);
        }
        .progress-circle.current {
            background: linear-gradient(135deg, #bfdbfe, #93c5fd);
            color: #1e3a8a;
            box-shadow: 0 3px 15px rgba(147,197,253,0.6);
            animation: pulse-current 2s infinite;
        }
        @keyframes pulse-current {
            0%,100% { box-shadow: 0 3px 15px rgba(147,197,253,.6); }
            50%      { box-shadow: 0 3px 25px rgba(147,197,253,1); }
        }
        /* متوقف شده — خاکستری */
        .progress-circle.paused {
            background: linear-gradient(135deg, #d1d5db, #e5e7eb);
            color: #374151;
            box-shadow: 0 3px 10px rgba(209,213,219,0.5);
        }

        /* ── جدول اصلی ──────────────────────── */
        .sheet-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            table-layout: auto;      /* ← auto تا ستون‌ها فشرده نشند */
        }

        /* سرستون‌ها */
        .sheet-table thead th {
            background: linear-gradient(135deg, #d9f99d, #bef264);
            color: #1a2e05;
            padding: 14px 8px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
            border-left: 1px solid rgba(0,0,0,0.08);
            vertical-align: bottom;
            min-width: 90px;
        }
        .sheet-table thead th.student-header {
            position: sticky;
            right: 48px;
            background: linear-gradient(135deg, #d9f99d, #bef264);
            z-index: 11;
            border-left: none;
            min-width: 200px;
            text-align: right;
            padding-right: 14px;
        }
        /* ستون شماره ردیف — چسبان به لبه راست، کنار ستون دانشجو */
        .sheet-table thead th.row-num-header {
            position: sticky;
            right: 0;
            background: linear-gradient(135deg, #d9f99d, #bef264);
            z-index: 12;
            border-left: none;
            width: 48px;
            min-width: 48px;
            max-width: 48px;
        }
        .sheet-table tbody td.row-num-cell {
            position: sticky;
            right: 0;
            background: white;
            z-index: 5;
            width: 48px;
            min-width: 48px;
            max-width: 48px;
            font-weight: bold;
            font-size: 12px;
            color: #64748b;
        }
        .sheet-table tbody tr:hover td.row-num-cell { background: #f1f5f9; }
        .sheet-table thead th:last-child { min-width: 70px; }

        /* سطرهای بدنه */
        .sheet-table tbody tr:hover { background: #f1f5f9; }
        .sheet-table tbody td {
            padding: 12px 8px;
            text-align: center;
            border-bottom: 1px solid #e5e7eb;
            vertical-align: middle;
            font-size: 13px;
        }
        .sheet-table tbody td.student-cell {
            position: sticky;
            right: 48px;
            background: white;
            text-align: right;
            padding: 12px 14px;
        }
        .sheet-table tbody tr:hover td.student-cell { background: #f1f5f9; }

        /* هدر هر مرحله */
        .stage-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .stage-num {
            background: rgba(0,0,0,0.08);
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;         /* ← بزرگ‌تر */
            font-weight: 700;
        }
        .stage-name {
            font-size: 13px;         /* ← بزرگ‌تر از ۸px قبلی */
            line-height: 1.4;
            max-width: 80px;
            word-break: break-word;
            text-align: center;
        }

        /* ── Drag & Drop هدر ستون‌ها ── */
        .sheet-table thead th[data-col-index] { cursor: grab; user-select: none; }
        .sheet-table thead th[data-col-index]:active { cursor: grabbing; }
        .sheet-table thead th.col-dragging { opacity: 0.5; }
        .sheet-table thead th.col-drag-over { outline: 2px dashed #4d7c0f; outline-offset: -3px; }

        /* آواتار دانشجو */
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #c7d2fe, #ddd6fe);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #3730a3;
            font-weight: bold;
            font-size: 15px;
            flex-shrink: 0;
        }

        /* ظرف اسکرول جدول */
        .table-wrapper {
            overflow: auto;
            flex: 1;
            min-height: 0;
            max-height: none;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        /* تب‌های مسیر */
        .path-tab {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
            font-size: 14px;
        }
        .path-tab.active {
            border-color: #3b82f6;
            box-shadow: 0 4px 15px rgba(59,130,246,0.3);
        }

        /* دکمه‌های فیلتر */
        .filter-btn.active {
            background: linear-gradient(135deg, #bfdbfe, #93c5fd);
            color: #1e3a8a;
            border-color: #93c5fd;
        }
    </style>
</head>
<body>
    <div class="max-w-full mx-auto" style="display:flex;flex-direction:column;flex:1;min-height:0;width:100%;">
        <!-- کادر جستجو — تنها عنصر بالای جدول -->
        <div class="bg-white rounded-xl shadow p-3 mb-3 flex-shrink-0" id="search-bar">
            <div class="flex gap-2 items-center">
                <input type="text" id="search-input" placeholder="جستجوی دانشجو..." 
                       class="flex-1 px-3 py-2 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-500"
                       oninput="filterStudents()">
                <button onclick="setFilter('all')" class="filter-btn active px-4 py-2 rounded-lg border-2 border-gray-200 text-sm" id="filter-all">همه</button>
                <button onclick="setFilter('in-progress')" class="filter-btn px-4 py-2 rounded-lg border-2 border-gray-200 text-sm" id="filter-in-progress">در حال انجام</button>
                <button onclick="setFilter('completed')" class="filter-btn px-4 py-2 rounded-lg border-2 border-gray-200 text-sm" id="filter-completed">تکمیل</button>
                <span id="autosave-indicator" class="text-xs text-gray-500 px-2 py-1 rounded-lg bg-gray-100 hidden">
                    <i class="fas fa-spinner fa-spin ml-1"></i>
                </span>
            </div>
        </div>
        
        <!-- Main Table -->
        <div id="fs-root" style="display:flex;flex-direction:column;flex:1;min-height:0;">
            <div class="table-wrapper" id="table-wrapper">
                <table class="sheet-table" id="sheet-table">
                    <thead id="table-head">
                        <!-- Will be rendered by JS -->
                    </thead>
                    <tbody id="table-body">
                        <!-- Will be rendered by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <link href="assets/libs/fontawesome/css/all.min.css" rel="stylesheet">
    
    <!-- Supabase SDK + ماژول‌ها — تا شیت حتی به‌صورت مستقیم (بدون iframe والد)
         بتواند تغییرات را مستقیم در Supabase ذخیره کند -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/supabase-auth.js"></script>
    <script src="js/supabase-data.js"></script>

    <!-- لود data.js برای دسترسی به داده‌های پیش‌فرض دانشجویان -->
    <script src="js/config.js"></script>
    <script src="js/realtime-events.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/data.js"></script>
    <script src="js/sample-students.js"></script>
    <script src="js/employee.js"></script>
    <script src="js/step-assignment.js"></script>
    
    <script>
        // مقداردهی اولیه data.js تا دانشجویان پیش‌فرض در localStorage نوشته شوند
        if (typeof DataModule !== 'undefined') {
            DataModule.initializeData();
        }
    </script>
    
    <script>
        // ── منطق فازها: گردش دفاع و ملزومات موازی‌اند ────
        // مراحل دفاع و ملزومات با هم پیش می‌روند؛ وقتی «هر دو» مسیر تمام شد،
        // مسیر فارغ‌التحصیلی شروع می‌شود.
        // ⚠️ درصدِ نمایش‌داده‌شده در شیت از کلیدهای prog_${id}_${path} می‌آید؛
        //    پس تشخیص «تکمیل» هم باید همین منبع را ببیند (نه فقط students_data)
        //    تا دانشجوی ۱۰۰٪ 🏆 بلافاصله از تب دفاع/ملزومات حذف و به فارغ‌التحصیلی منتقل شود.
        //    این کلیدها فقط «کش محلی» جدول student_progress در Supabase هستند —
        //    منبع حقیقت همان دیتابیس است (پول دوره‌ای در _pullProgressFromSupabase).
        //    اولویت دقیقاً مثل loadProgress است: prog_ (دیتابیس) مقدم است و
        //    students_data فقط وقتی کلید prog_ وجود ندارد به‌عنوان جایگزین خوانده می‌شود.
        function _progAllCompleted(id, path) {
            // true/false = وضعیت تکمیل بر اساس prog_  |  null = کلید prog_ وجود ندارد
            try {
                const raw = localStorage.getItem(`prog_${id}_${path}`);
                if (!raw) return null;
                const arr = JSON.parse(raw);
                const stepCount = (STEPS[path] || []).length;
                if (!Array.isArray(arr) || stepCount === 0) return false;
                const sliced = arr.slice(0, stepCount);
                while (sliced.length < stepCount) sliced.push({ status: STATUS_INCOMPLETE });
                return sliced.every(p => ((p && p.status) ?? STATUS_INCOMPLETE) === STATUS_COMPLETED);
            } catch (e) { return null; }
        }
        function _hasProgKey(id, path) {
            try { return !!localStorage.getItem(`prog_${id}_${path}`); } catch (e) { return false; }
        }
        function _defenseDone(s) {
            // اولویت با prog_ (کشِ جدول student_progress در دیتابیس — همان منبعِ درصدِ شیت)
            const fromProg = _progAllCompleted(s.id, 'defense');
            if (fromProg !== null) return fromProg;
            // بدون کلید prog_ → از students_data
            const def = s.defenseSteps || [];
            return def.length > 0 && def.every(x => x.completed);
        }
        function _requirementsDone(s) {
            // اولویت با prog_ (کشِ جدول student_progress در دیتابیس — همان منبعِ درصدِ شیت)
            const fromProg = _progAllCompleted(s.id, 'requirements');
            if (fromProg !== null) return fromProg;
            // بدون کلید prog_ → از students_data
            const req = s.requirementsSteps || [];
            return req.length > 0 && req.every(x => x.completed);
        }
        // اگر ملزومات برای دانشجو ثبت نشده باشد (نه در students_data و نه prog_)،
        // فقط اتمام دفاع کافی است
        function _isGraduatedPhase(s) {
            if (s.graduated) return true;
            const req = s.requirementsSteps || [];
            const reqTracked = req.length > 0 || _hasProgKey(s.id, 'requirements');
            const reqOk = !reqTracked || _requirementsDone(s);
            return _defenseDone(s) && reqOk;
        }
        function _getActivePath(s) {
            // اگر currentPath صریحاً تنظیم شده → همون رو برگردون
            // (منبع: profiles.current_path — مطابق _getStudentActivePath در employee.js)
            if (s.currentPath) return s.currentPath;
            return _isGraduatedPhase(s) ? 'educational' : 'defense';
        }

        // در فاز «در حال تحصیل» (current_path='studying')، مراحل مشترکِ
        // دفاع/ملزومات هنوز ثبت نشده‌اند → فاز پیش از دفاع، موازی با هر دو مسیر
        function _isStudyingPhase(s) {
            return s.currentPath === 'studying';
        }

        // دفاع و ملزومات موازی‌اند → همان گروه دانشجو (فاز فعال) در هر دو تب نمایش داده می‌شود
        // مسیر صریح (profiles.current_path) اولویت دارد — مطابق فیلترهای تب‌های employee.js
        function _shouldShowInDefense(s) {
            if (s.active === false) return false;
            if (s.currentPath) return s.currentPath === 'defense';
            return !_isGraduatedPhase(s);
        }
        function _shouldShowInRequirements(s) {
            if (s.active === false) return false;
            // ملزومات موازی دفاع است — دانشجویانی که مسیرشان defense/requirements است
            if (s.currentPath) return s.currentPath === 'defense' || s.currentPath === 'requirements';
            return !_isGraduatedPhase(s);
        }
        function _shouldShowInEducational(s) {
            if (s.active === false) return false;
            if (s.currentPath) return s.currentPath === 'educational';
            return _isGraduatedPhase(s);
        }
        // تب مستقل «در حال تحصیل» — فقط current_path='studying'
        function _shouldShowInStudying(s) {
            return _isStudyingPhase(s);
        }

        // ── مراحل پیش‌فرض — دقیقاً همان مراحل employee.js ─────────────────
        // این مقادیر باید با getDefaultDefenseSteps2(), getDefaultEducationalSteps(),
        // getDefaultRequirementsSteps() در employee.js یکسان باشند.
        const DEFAULT_STEPS = {
            defense: [
                'ثبت عنوان','تنضید','ترجمه','استلال','ملخص',
                'مدرک لغت(فیش)','بارگزاری','تایید استاد','مشابهت',
                'مدیر گروه','معاون','سفارش','ق و م',
                'تسویه حساب','وکالت','ثبت نام ایرانداک','زمان پور'
            ],
            requirements: [
                'امر اداری','پروپوزال','مدرک لغت','ترجمه پایان نامه فارسی',
                'ملخص','مشابهت','ترجمه','قطعه','لافته','چهارنسخه','تنضید رساله'
            ],
            educational: [
                'در حال تحصیل',
                'وکالت','تسویه حساب','تعدیلات','مدرک کارشناسی',
                'استلال عراقی','ملخص','محضر و اصالت','تنضید ایرانداک',
                'تنضید تجلید','تجلید','بارگزاری ایرانداک','ایجاد گردش',
                'آزفا','اسماعیلی','کتابخانه','کد',
                'خروج قطعی','دریافت مدرک','تصدیق','تسویه حساب نهایی','ارسال'
            ],
            // مسیر مستقل «در حال تحصیل» — دانشجویان پیش از دفاع
            // شامل فاز در-حال-تحصیل + ۴ زیرمرحلهٔ آن (قبلاً به‌اشتباه انتهای
            // مسیر فارغ‌التحصیلی بودند — ایندکس prog_ مسیر studying مستقل است)
            studying: [
                'در حال تحصیل',
                'پاس کردن واحد ها','پرداخت اقساط','قفل کردن دروس','تنزیل نمرات'
            ]
        };

        // ── خواندن مراحل از localStorage (همان کلیدهایی که employee.js می‌نویسد) ─
        function loadStepsFromStorage() {
            const parse = (key, fallback) => {
                try {
                    const raw = localStorage.getItem(key);
                    if (raw) {
                        const arr = JSON.parse(raw);
                        // هر آیتم می‌تواند آبجکت {name,...} یا رشته ساده باشد
                        return arr.map(s => (typeof s === 'string' ? s : s.name));
                    }
                } catch(e) {}
                return fallback;
            };

            let educational = parse('custom_educational_steps', DEFAULT_STEPS.educational);
            // ── هم‌ترازی کشِ قدیمی ──
            // اگر custom_educational_steps ذخیره‌شده فاز «در حال تحصیل» را نداشت
            // (کشِ قبل از این آپدیت)، با لیست پیش‌فرض جدید جایگزین می‌شود تا
            // شیت و فلوچارت همان مراحل employee.js را ببینند.
            if (!educational.includes('در حال تحصیل')) {
                educational = DEFAULT_STEPS.educational.slice();
                try {
                    localStorage.setItem('custom_educational_steps',
                        JSON.stringify(educational.map(n => ({ name: n, completed: false, date: null, notes: '' }))));
                } catch(e) {}
            }

            return {
                defense:      parse('custom_defense_steps',      DEFAULT_STEPS.defense),
                requirements: parse('custom_requirements_steps',  DEFAULT_STEPS.requirements),
                educational:  educational,
                // مسیر مستقل «در حال تحصیل» — کلید اختصاصی، بدون fallback به مسیر دیگر
                studying:     parse('custom_studying_steps',     DEFAULT_STEPS.studying)
            };
        }

        // STEPS به صورت پویا از localStorage خوانده می‌شود
        let STEPS = loadStepsFromStorage();

        // وقتی صفحه focus می‌گیرد (برگشت از تب مدیریت) مراحل را دوباره بارگذاری کن
        window.addEventListener('focus', () => {
            STEPS = loadStepsFromStorage();
            loadStudents();
            renderTable();
        });

        // اگر از همان origin localStorage تغییر کند (تب دیگر / صفحه والد / iframe)
        window.addEventListener('storage', (e) => {
            const stepKeys   = ['custom_defense_steps','custom_requirements_steps','custom_educational_steps'];
            const dataKeys   = ['students_data', 'edu_system_users'];
            const isProgKey  = e.key && e.key.startsWith('prog_');
            if (stepKeys.includes(e.key) || dataKeys.includes(e.key) || isProgKey) {
                if (stepKeys.includes(e.key)) {
                    STEPS = loadStepsFromStorage();
                }
                loadStudents();
                renderTable();
            }
        });

        const STATUS_INCOMPLETE = 0;
        const STATUS_CURRENT    = 1;
        const STATUS_COMPLETED  = 2;
        const STATUS_PAUSED     = 3;   // متوقف شده
        
        let currentPath = 'defense';
        let students = [];
        let currentFilter = 'all';
        let searchTerm = '';
        
        // آخرین باری که saveProgress محلی نوشت — تا پولِ دوره‌ای دیتابیس،
        // تغییرات تازه‌ی همین صفحه را بازنویسی (clobber) نکند
        let _lastLocalWriteAt = 0;

        // ── pull پیشرفت از Supabase (جدول student_progress) → کلیدهای prog_ → رفرش ──
        // کلیدهای prog_ فقط کش محلی‌اند؛ منبع اصلی جدول student_progress در دیتابیس است.
        // این تابع روی لود، هر ۳۰ ثانیه و هنگام تمرکز/نمایش مجدد فراخوانی می‌شود تا
        // تغییراتی که کاربران دیگر (دستگاه‌های دیگر) در دیتابیس ثبت کرده‌اند هم
        // بلافاصله در شیت دیده شود و جابه‌جایی تب‌ها (فارغ‌التحصیلی و ...) خودکار باشد.
        async function _pullProgressFromSupabase() {
            try {
                const sb = (typeof window.parent !== 'undefined' && window.parent !== window && window.parent.SupabaseDataModule)
                    ? window.parent.SupabaseDataModule
                    : (typeof SupabaseDataModule !== 'undefined' ? SupabaseDataModule : null);
                if (!sb || typeof sb.getAllStudentProgress !== 'function') return false;
                // اگر همین الان تغییرات محلی ذخیره شده، این پول آن‌ها را نپوشاند
                if (Date.now() - _lastLocalWriteAt < 5000) return false;
                // اگر صف retry هنوز چیزی برای ارسال دارد، پول نکن (پول با دادهٔ کهنهٔ ابر
                // تغییرات در انتظار را روی prog_ بازنویسی می‌کند)
                if (_pendingProgressQueue.size > 0) return false;
                // وضعیت قبل از پول — برای تشخیص clobber
                const _before = students.slice(0, 5).map(s =>
                    `${s.id}:${(s.progress[currentPath] || []).filter(p => p.status === STATUS_COMPLETED).length}`).join(' | ');
                const map = await sb.getAllStudentProgress();
                if (!map) return false;
                loadStudents();
                // وضعیت بعد از پول — اگر تعداد تکمیل‌شده‌ها افت کرد = clobber از DB
                const _after = students.slice(0, 5).map(s =>
                    `${s.id}:${(s.progress[currentPath] || []).filter(p => p.status === STATUS_COMPLETED).length}`).join(' | ');
                if (_before !== _after) {
                    console.warn(`🔍 sheet pull دیاگستیک — قبل: [${_before}] بعد: [${_after}]`);
                }
                console.log(`✅ sheet: پیشرفت ${Object.keys(map).length} دانشجو/مسیر از Supabase همگام شد`);
                renderTable();
                return true;
            } catch (e) { console.warn('⚠️ sheet Supabase pull خطا:', e); return false; }
        }

        document.addEventListener('DOMContentLoaded', () => {
            // ── مسیر اولیه از URL (?path=defense/requirements/educational/studying) ──
            // (از دکمه‌های «نمای شیت» در تب‌های لیست دانشجویان)
            try {
                const qpPath = new URLSearchParams(window.location.search).get('path');
                if (qpPath && STEPS[qpPath]) {
                    currentPath = qpPath;
                }
            } catch(e) {}

            // ── اولین رندر فقط بعد از اولین pull از دیتابیس ──
            // علت: کلیدهای prog_ محلی ممکن است کهنه باشند (تغییرات از دستگاه دیگر
            // یا رفرش وسط ذخیره). رندر فوری با دادهٔ کهنه = «ریست شدن» کاذب.
            // تا اولین pull (یا شکست آن) اسپینر نشان می‌دهیم.
            const tbody = document.getElementById('table-body');
            if (tbody) tbody.innerHTML = `
                <tr><td colspan="99" style="text-align:center; padding:40px 0; color:#6b7280;">
                    <i class="fas fa-spinner fa-spin" style="font-size:22px;"></i>
                    <div style="margin-top:8px; font-size:13px;">در حال دریافت وضعیت از سرور...</div>
                </td></tr>`;
            loadStudents();      // دادهٔ اولیه (لیست دانشجویان)

            _flushProgressQueue().catch(() => {}).finally(() => {
                // بعد از تلاش flush صف، پول اول — سپس رندر
                _pullProgressFromSupabase().finally(() => {
                    renderTable();
                });
            });

            // ── خروج/بستن صفحه: نجات تغییرات در حال پرواز + flush صف retry ──
            // iframe با خروج از نمای شیت از DOM حذف می‌شود و fetchهای در حال اجرا
            // لغو می‌شوند → آخرین toggleها هرگز به DB نمی‌رسند. keepalive fetch
            // (flushUnsavedProgressBeacon) حتی بعد از بسته‌شدن صفحه کامل می‌شود.
            const _rescue = () => {
                try {
                    const sbInst = (typeof SupabaseDataModule !== 'undefined') ? SupabaseDataModule : null;
                    if (sbInst && typeof sbInst.flushUnsavedProgressBeacon === 'function') {
                        sbInst.flushUnsavedProgressBeacon();
                    }
                } catch (e) { /* ignore */ }
                _flushProgressQueue();
            };
            window.addEventListener('pagehide', _rescue);
            window.addEventListener('beforeunload', _rescue);

            // منبع حقیقت = دیتابیس؛ همگام‌سازی دوره‌ای + هنگام تمرکز مجدد صفحه
            setInterval(_pullProgressFromSupabase, 30000);
            window.addEventListener('focus', _pullProgressFromSupabase);
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') _pullProgressFromSupabase();
            });

            // ── Realtime: هر تغییر در جدول student_progress (از هر دستگاهی) ──
            //    صفحهٔ والد روی این جدول subscribe است و رویداد STUDENTS_CHANGED
            //    می‌فرستد → پول فوری به‌جای انتظار برای پول ۳۰ ثانیه‌ای.
            //    debounce: یک ذخیرهٔ چندمرحله‌ای چند رویداد پشت‌سرهم می‌سازد.
            let _rtPullTimer = null;
            try {
                const parentRE = (window.parent !== window && window.parent.RealtimeEvents)
                    ? window.parent.RealtimeEvents : null;
                if (parentRE && parentRE.EVENTS && typeof parentRE.on === 'function') {
                    parentRE.on(parentRE.EVENTS.STUDENTS_CHANGED, () => {
                        if (_rtPullTimer) clearTimeout(_rtPullTimer);
                        _rtPullTimer = setTimeout(_pullProgressFromSupabase, 1500);
                    }, 'progress-sheet');
                }
            } catch (e) { /* دسترسی به والد نیست — پول دوره‌ای پوشش می‌دهد */ }
        });
        
        function loadStudents() {
            let rawList = [];

            // ۱. منبع اصلی: edu_system_users (دقیقاً مثل getAllStudents در employee.js)
            try {
                const usersRaw = localStorage.getItem('edu_system_users');
                if (usersRaw) {
                    JSON.parse(usersRaw).forEach(u => {
                        if (u.role === 'student') {
                            rawList.push({
                                id: u.id, name: u.name, major: u.field || '-',
                                avatar: u.name?.charAt(0) || 'د',
                                currentPath: u.currentPath || null,
                                graduated:   u.graduated || false,
                                active:      u.active !== false
                            });
                        }
                    });
                }
            } catch (e) {}

            // ۲. ادغام students_data — بدون شرط role
            //    (بسیاری از نویسنده‌های students_data فیلد role نمی‌نویسند؛
            //     فقط نقش‌های غیر دانشجویی حذف می‌شوند)
            try {
                const stored = localStorage.getItem('students_data');
                if (stored) {
                    Object.values(JSON.parse(stored)).forEach(s => {
                        if (s.role && s.role !== 'student') return;
                        const existing = rawList.find(r => r.id === s.id);
                        if (existing) {
                            existing.name        = s.name  || existing.name;
                            existing.major       = s.field || existing.major;
                            existing.avatar      = (s.name || existing.name)?.charAt(0) || 'د';
                            existing.currentPath = s.currentPath || existing.currentPath || null;
                            existing.graduated   = s.graduated || existing.graduated || false;
                            existing.active      = s.active !== undefined ? s.active : (existing.active !== false);
                        } else {
                            rawList.push({
                                ...s,
                                name:  s.name  || '-',
                                major: s.field || '-',
                                avatar: s.name?.charAt(0) || 'د',
                                currentPath: s.currentPath || null,
                                graduated:   s.graduated || false,
                                active:      s.active !== undefined ? s.active : true
                            });
                        }
                    });
                }
            } catch (e) {}

            // ۳. مراحل هر دانشجو — مثل getAllStudents: اگر نداشت، پیش‌فرض بساز
            //    (بدون این، مسیر فعال همه دانشجوها اشتباهی «فارغ‌التحصیلی» می‌شود)
            const defDefaults = () => (typeof EmployeeModule !== 'undefined' && EmployeeModule.getDefaultDefenseSteps2)
                ? EmployeeModule.getDefaultDefenseSteps2()
                : DEFAULT_STEPS.defense.map(n => ({ name: n, completed: false }));
            const eduDefaults = () => (typeof EmployeeModule !== 'undefined' && EmployeeModule.getDefaultEducationalSteps)
                ? EmployeeModule.getDefaultEducationalSteps()
                : DEFAULT_STEPS.educational.map(n => ({ name: n, completed: false }));

            rawList.forEach(s => {
                if (!Array.isArray(s.defenseSteps)     || s.defenseSteps.length === 0)     s.defenseSteps     = defDefaults();
                if (!Array.isArray(s.educationalSteps) || s.educationalSteps.length === 0) s.educationalSteps = eduDefaults();
                if (!Array.isArray(s.requirementsSteps)) s.requirementsSteps = [];
            });

            // ۴. تعیین مسیر فعال هر دانشجو
            rawList.forEach(s => {
                s._activePath = _getActivePath(s);
            });

            students = rawList.map(s => ({
                ...s,
                progress: {
                    educational: loadProgress(s.id, 'educational',  s.educationalSteps),
                    defense:     loadProgress(s.id, 'defense',      s.defenseSteps),
                    requirements:loadProgress(s.id, 'requirements', s.requirementsSteps),
                    // مسیر مستقل «در حال تحصیل» — همان ۴ زیرمرحله + فاز اصلی؛
                    // از انتهای educationalSteps دانشجو خوانده می‌شود (۴ مرحله آخر)
                    studying:    loadProgress(s.id, 'studying',     s.educationalSteps)
                }
            }));
        }
        
        function loadProgress(id, path, studentSteps) {
            const saved = localStorage.getItem(`prog_${id}_${path}`);
            if (!STEPS[path]) return [];
            const stepCount = STEPS[path].length;

            // مسیر studying — مراحل آن ۴ زیرمرحلهٔ انتهاییِ educationalSteps است؛
            // کش prog_ مستقل (prog_${id}_studying) مقدم است
            if (path === 'studying' && !saved && Array.isArray(studentSteps)) {
                const names = STEPS.studying;
                const tail = studentSteps.slice(-names.length);   // ۴+۱ مرحلهٔ انتهایی
                const prog = names.map((n, i) => {
                    const st = tail[i];
                    return { status: (st && st.completed) ? STATUS_COMPLETED : (st && st.paused) ? STATUS_PAUSED : STATUS_INCOMPLETE };
                });
                return prog;
            }

            if (saved) {
                const arr = JSON.parse(saved);
                // اگر تعداد مراحل بیشتر شده، مراحل جدید را اضافه کن
                if (arr.length < stepCount) {
                    for (let i = arr.length; i < stepCount; i++) {
                        arr.push({ status: STATUS_INCOMPLETE });
                    }
                }
                // اگر کمتر شده، برش بده
                return arr.slice(0, stepCount);
            }

            // بدون prog_ ذخیره‌شده → از مراحل students_data استخراج کن
            // (وضعیت واقعی: completed→2، paused→3، بقیه→0)
            if (studentSteps && Array.isArray(studentSteps) && studentSteps.length > 0) {
                const prog = studentSteps.slice(0, stepCount).map(s => ({
                    status: (s && s.completed) ? STATUS_COMPLETED : (s && s.paused) ? STATUS_PAUSED : STATUS_INCOMPLETE
                }));
                // اگر مراحل شیت بیشتر از students_data بود، بقیه خالی
                while (prog.length < stepCount) prog.push({ status: STATUS_INCOMPLETE });
                return prog;
            }

            // پیش‌فرض: اولین مرحله «در حال انجام»
            return STEPS[path].map((_, i) => ({ status: i === 0 ? STATUS_CURRENT : STATUS_INCOMPLETE }));
        }
        
        function saveProgress(id, path, data) {
            // ── ذخیرهٔ خودکار آنی: اول ابر (منبع حقیقت)، بعد کش محلی ──
            _showAutosaveIndicator('saving');
            _syncProgressToSupabase(id, path, data);

            localStorage.setItem(`prog_${id}_${path}`, JSON.stringify(data));
            _lastLocalWriteAt = Date.now();   // پول دوره‌ایِ دیتابیس تا ۵ ثانیه این را بازنویسی نکند
            // اطلاع به فلوچارت (اگر در تب دیگری باز باشد)
            window.dispatchEvent(new StorageEvent('storage', { key: `prog_${id}_${path}` }));
        }

        // ── نشانگر ذخیرهٔ خودکار (spinner → تیک سبز) ──
        let _autosaveHideTimer = null;
        function _showAutosaveIndicator(state, pendingCount) {
            const el = document.getElementById('autosave-indicator');
            if (!el) return;
            el.classList.remove('hidden');
            if (_autosaveHideTimer) clearTimeout(_autosaveHideTimer);
            if (state === 'saving') {
                el.innerHTML = '<i class="fas fa-spinner fa-spin ml-1"></i> ذخیره...';
                el.className = 'text-xs text-gray-600 px-2 py-1 rounded-lg bg-gray-100';
            } else if (state === 'ok') {
                el.innerHTML = '<i class="fas fa-check ml-1"></i> ذخیره شد' + (pendingCount ? ` (${pendingCount} در صف)` : '');
                el.className = 'text-xs text-green-700 px-2 py-1 rounded-lg bg-green-100';
                _autosaveHideTimer = setTimeout(() => el.classList.add('hidden'), 2000);
            } else { // error — در صف retry ماند
                el.innerHTML = `<i class="fas fa-clock ml-1"></i> در صف ارسال${pendingCount ? ` (${pendingCount})` : ''}`;
                el.className = 'text-xs text-amber-700 px-2 py-1 rounded-lg bg-amber-100';
                _autosaveHideTimer = setTimeout(() => el.classList.add('hidden'), 4000);
            }
        }

        // ── صف retry برای تغییراتی که ذخیرهٔ ابرشان شکست خورده ──
        // کلید: `${studentId}|${path}` → مقدار: آخرین آرایهٔ progress
        const _pendingProgressQueue = new Map();
        let _retryTimer = null;

        function _enqueueProgressRetry(studentId, pathType, progressArray, reason) {
            _pendingProgressQueue.set(`${studentId}|${pathType}`, { studentId, pathType, progressArray });
            console.warn(`⚠️ sheet: ذخیرهٔ Supabase ناموفق (${reason}) — در صف retry: ${studentId}/${pathType}`);
            _showAutosaveIndicator('error', _pendingProgressQueue.size);
            if (_retryTimer) clearTimeout(_retryTimer);
            _retryTimer = setTimeout(_flushProgressQueue, 3000);
        }

        async function _flushProgressQueue() {
            _retryTimer = null;
            if (_pendingProgressQueue.size === 0) return;
            const sb = _sheetSb();
            if (!sb) { _retryTimer = setTimeout(_flushProgressQueue, 5000); return; } // آفلاین — بعداً

            if (_pendingProgressQueue.size > 0) _showAutosaveIndicator('saving');

            const batch = Array.from(_pendingProgressQueue.values());
            const failed = [];
            for (const item of batch) {
                try {
                    const ok = await sb.saveStudentProgress(item.studentId, item.pathType, item.progressArray);
                    if (!ok) failed.push(item);
                    else _pendingProgressQueue.delete(`${item.studentId}|${item.pathType}`);
                } catch (e) {
                    failed.push(item);
                }
            }
            // چیزی ناموفق ماند → دوباره تلاش کن (backoff ساده)
            if (failed.length > 0) {
                console.warn(`⚠️ sheet: ${failed.length} progress در صف retry ماند`);
                _showAutosaveIndicator('error', _pendingProgressQueue.size);
                _retryTimer = setTimeout(_flushProgressQueue, 8000);
            } else {
                _showAutosaveIndicator('ok', 0);
            }
        }

        // ── گرفتن ماژول Supabase — مستقیم یا از والد (اگر داخل iframe باشد) ──
        function _sheetSb() {
            try {
                if (typeof window.parent !== 'undefined' && window.parent !== window &&
                    window.parent.SupabaseDataModule &&
                    typeof window.parent.SupabaseDataModule.saveStudentProgress === 'function') {
                    return window.parent.SupabaseDataModule;
                }
            } catch (e) { /* cross-origin — ادامه */ }
            return (typeof SupabaseDataModule !== 'undefined' &&
                    typeof SupabaseDataModule.saveStudentProgress === 'function')
                ? SupabaseDataModule : null;
        }

        // sync پیشرفت یک دانشجو/مسیر به Supabase — «سریالی» برای هر کلید
        // ⚠️ ریشهٔ باگ «ریست شدن بخشی از مراحل»: toggleهای سریع پشت‌سرهم، چند
        // upsert همزمان می‌ساختند که به‌ترتیب کامل نمی‌شدند — ذخیرهٔ کهنه‌تر
        // (مثلاً ۳ مرحلهٔ تکمیل) بعد از ذخیرهٔ جدیدتر (۸ مرحله) در DB می‌نشست
        // و بقیهٔ مراحل «پاک» به نظر می‌رسید.
        // راه‌حل: برای هر کلید `${studentId}|${pathType}` حداکثر یک درخواست در
        // حال اجرا؛ toggleهای حین اجرا در صف می‌مانند و «آخرین وضعیت» پس از
        // تمام‌شدن درخواست قبلی ارسال می‌شود — همیشه جدیدترین وضعیت، به‌ترتیب.
        const _inflightSaves = new Map();   // key → Promise در حال اجرا
        const _queuedSaves  = new Map();    // key → آخرین آرایه در انتظار ارسال

        function _syncProgressToSupabase(studentId, pathType, progressArray) {
            const key = `${studentId}|${pathType}`;
            _queuedSaves.set(key, { studentId, pathType, progressArray });
            _pumpProgressSaves();
        }

        function _pumpProgressSaves() {
            // هر کلید که در حال ارسال نیست، آخرین وضعیت صفش را بفرست
            for (const [key, item] of Array.from(_queuedSaves.entries())) {
                if (_inflightSaves.has(key)) continue;
                _queuedSaves.delete(key);
                const p = _doSaveProgress(item.studentId, item.pathType, item.progressArray)
                    .catch(() => {});
                _inflightSaves.set(key, p);
                p.finally(() => {
                    _inflightSaves.delete(key);
                    // حین این درخواست، toggle تازه‌ای آمده؟ بفرست (ترتیب حفظ می‌شود)
                    if (_queuedSaves.has(key)) _pumpProgressSaves();
                });
            }
        }

        async function _doSaveProgress(studentId, pathType, progressArray) {
            const sb = _sheetSb();
            if (!sb) {
                _enqueueProgressRetry(studentId, pathType, progressArray, 'ماژول در دسترس نیست');
                return;
            }
            try {
                const ok = await sb.saveStudentProgress(studentId, pathType, progressArray);
                if (ok) {
                    // 🔍 دیاگستیک: وضعیت واقعی آرایه‌ای که در DB نشست
                    const done = progressArray.filter(p => p && p.status === STATUS_COMPLETED).length;
                    console.log(`✅ sheet sync OK: ${studentId}/${pathType} → ${done} تکمیل از ${progressArray.length} [${progressArray.map(p => p.status).join(',')}]`);
                    _showAutosaveIndicator('ok', _queuedSaves.size);
                } else {
                    _enqueueProgressRetry(studentId, pathType, progressArray, 'خطای ذخیره');
                }
            } catch(e) {
                _enqueueProgressRetry(studentId, pathType, progressArray, e.message);
            }
        }
        
        function selectPath(path) {
            currentPath = path;
            renderTable();
        }

        // ── ترتیب ستون‌ها (drag & drop) — ذخیره در localStorage برای هر مسیر ──
        function loadColumnOrder() {
            try {
                const raw = localStorage.getItem(`sheet_col_order_${currentPath}`);
                if (raw) {
                    const arr = JSON.parse(raw);
                    if (Array.isArray(arr) && arr.length === STEPS[currentPath].length) return arr;
                }
            } catch(e) {}
            return STEPS[currentPath].map((_, i) => i);   // ترتیب پیش‌فرض
        }
        function saveColumnOrder(order) {
            try { localStorage.setItem(`sheet_col_order_${currentPath}`, JSON.stringify(order)); } catch(e) {}
        }

        // ── Drag & Drop هدر ستون‌ها (شبیه چک‌لیست کاری) ──
        function initColumnDragDrop() {
            const thead = document.getElementById('table-head');
            if (!thead) return;
            let draggingTh = null;

            thead.querySelectorAll('th[data-col-index]').forEach(th => {
                th.setAttribute('draggable', 'true');

                th.addEventListener('dragstart', (e) => {
                    draggingTh = th;
                    th.classList.add('col-dragging');
                    e.dataTransfer.effectAllowed = 'move';
                    try { e.dataTransfer.setData('text/plain', th.dataset.colIndex); } catch(err) {}
                });

                th.addEventListener('dragend', () => {
                    th.classList.remove('col-dragging');
                    thead.querySelectorAll('th.col-drag-over').forEach(el => el.classList.remove('col-drag-over'));
                    draggingTh = null;
                    // ذخیره ترتیب جدید بر اساس DOM
                    const domOrder = Array.from(thead.querySelectorAll('th[data-col-index]'))
                        .map(el => parseInt(el.dataset.colIndex, 10));
                    saveColumnOrder(domOrder);
                    renderTable();
                });

                th.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    if (!draggingTh || draggingTh === th) return;
                    e.dataTransfer.dropEffect = 'move';
                    thead.querySelectorAll('th.col-drag-over').forEach(el => el.classList.remove('col-drag-over'));
                    th.classList.add('col-drag-over');
                    const rect = th.getBoundingClientRect();
                    if (e.clientX > rect.left + rect.width / 2) {
                        th.after(draggingTh);
                    } else {
                        th.before(draggingTh);
                    }
                });
            });
        }

        function renderTable() {
            const thead = document.getElementById('table-head');
            const tbody = document.getElementById('table-body');
            const steps = STEPS[currentPath];
            
            // ترتیب ستون‌ها (drag & drop)
            const colOrder = loadColumnOrder();   // آرایه‌ای از اندیس‌های مرحله
            
            // Header
            let headerHTML = '<tr><th class="row-num-header">#</th><th class="student-header">دانشجو</th>';
            colOrder.forEach(stepIdx => {
                const step = steps[stepIdx];
                headerHTML += `<th data-col-index="${stepIdx}" title="برای جابه‌جایی، ستون را بکشید">
                    <div class="stage-header">
                        <div class="stage-num">${stepIdx + 1}</div>
                        <div class="stage-name">${step}</div>
                    </div>
                </th>`;
            });
            headerHTML += '<th>%</th></tr>';
            thead.innerHTML = headerHTML;
            
            // Filter — همان شرایط تب‌های صفحه دانشجویان در employee.js
            let filtered;
            if (currentPath === 'educational') {
                // educational: کسانی که currentPath='educational' یا همه مراحل دفاع تموم کردند
                filtered = students.filter(s => _shouldShowInEducational(s));
            } else if (currentPath === 'requirements') {
                // ملزومات موازی دفاع است — دانشجویانی که گردش ملزومات دارند
                filtered = students.filter(s => _shouldShowInRequirements(s));
            } else if (currentPath === 'studying') {
                // تب مستقل «در حال تحصیل» — دانشجویان پیش از دفاع
                filtered = students.filter(s => _shouldShowInStudying(s));
            } else {
                filtered = students.filter(s => _shouldShowInDefense(s));
            }
            if (searchTerm) {
                filtered = filtered.filter(s => s.name.includes(searchTerm) || s.major.includes(searchTerm));
            }
            filtered = filtered.filter(s => {
                const prog = s.progress[currentPath];
                const done = prog.filter(p => p.status === STATUS_COMPLETED).length;
                if (currentFilter === 'completed') return done === prog.length;
                if (currentFilter === 'in-progress') return done > 0 && done < prog.length;
                return true;
            });
            
            // Body
            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${steps.length + 3}" class="text-center py-8 text-gray-500">
                    <i class="fas fa-user-graduate text-3xl mb-2 block"></i>دانشجویی یافت نشد
                </td></tr>`;
                return;
            }
            
            let bodyHTML = '';
            let rowNum = 0;
            filtered.forEach(student => {
                rowNum++;
                const prog = student.progress[currentPath];
                const done = prog.filter(p => p.status === STATUS_COMPLETED).length;
                const pct = Math.round((done / prog.length) * 100);
                
                bodyHTML += '<tr>';
                bodyHTML += `<td class="row-num-cell">${rowNum}</td>`;
                bodyHTML += `<td class="student-cell" style="cursor:pointer" title="ویرایش پروفایل دانشجو" onclick="openStudentProfile('${student.id}')">
                    <div class="flex items-center gap-2">
                        <div class="avatar">${student.avatar}</div>
                        <div class="overflow-hidden">
                            <div class="font-bold truncate" style="font-size:14px">${student.name}</div>
                            <div class="text-gray-500 truncate" style="font-size:12px">${student.major}</div>
                        </div>
                    </div>
                </td>`;
                
                colOrder.forEach(stageIdx => {
                    const stage = prog[stageIdx];
                    const status = stage?.status ?? STATUS_INCOMPLETE;
                    let cls = 'incomplete', icon = '<i class="fas fa-times"></i>';
                    if (status === STATUS_COMPLETED)      { cls = 'completed'; icon = '<i class="fas fa-check"></i>'; }
                    else if (status === STATUS_CURRENT)   { cls = 'current';   icon = '<i class="fas fa-hourglass-half"></i>'; }
                    else if (status === STATUS_PAUSED)    { cls = 'paused';    icon = '<i class="fas fa-pause"></i>'; }
                    
                    bodyHTML += `<td>
                        <div class="progress-circle ${cls}" title="${status===0?'تکمیل نشده':status===1?'در حال انجام':status===2?'تکمیل شده':'متوقف شده'}" onclick="toggleStage('${student.id}', ${stageIdx})">${icon}</div>
                    </td>`;
                });
                
                bodyHTML += `<td>
                    <span class="px-2 py-1 rounded-full font-bold" style="font-size:13px; white-space:nowrap; background:${pct===100?'#dcfce7':pct>50?'#dbeafe':'#fee2e2'}; color:${pct===100?'#15803d':pct>50?'#1d4ed8':'#b91c1c'}">
                        ${pct}${pct === 100 ? ' 🏆' : '%'}
                    </span>
                </td>`;
                bodyHTML += '</tr>';
            });
            
            tbody.innerHTML = bodyHTML;
            initColumnDragDrop();
        }

        // ── کلیک روی نام دانشجو → باز کردن ویرایش پروفایل در صفحه والد ──
        function openStudentProfile(studentId) {
            try {
                if (window.parent && window.parent !== window &&
                    window.parent.employeeModule &&
                    typeof window.parent.employeeModule.editStudentProfile === 'function') {
                    window.parent.employeeModule.editStudentProfile(studentId);
                }
            } catch(e) {
                console.warn('openStudentProfile error:', e);
            }
        }
        
        function toggleStage(studentId, stageIndex) {
            const student = students.find(s => s.id === studentId);
            if (!student) return;
            
            const prog = student.progress[currentPath];
            const current = prog[stageIndex]?.status ?? STATUS_INCOMPLETE;
            
            // Cycle: incomplete → current → completed → paused → incomplete
            if (current === STATUS_INCOMPLETE)      prog[stageIndex].status = STATUS_CURRENT;
            else if (current === STATUS_CURRENT)    prog[stageIndex].status = STATUS_COMPLETED;
            else if (current === STATUS_COMPLETED)  prog[stageIndex].status = STATUS_PAUSED;
            else                                    prog[stageIndex].status = STATUS_INCOMPLETE;
            
            saveProgress(studentId, currentPath, prog);

            // ── sync وضعیت به students_data ──────────────────────────────────
            try {
                const studentsData = JSON.parse(localStorage.getItem('students_data') || '{}');
                if (!studentsData[studentId]) {
                    studentsData[studentId] = { id: studentId, name: student.name, field: student.major, role: 'student' };
                }
                const stepKeyMap = { defense: 'defenseSteps', educational: 'educationalSteps', requirements: 'requirementsSteps' };
                // مسیر studying: ۴ زیرمرحلهٔ انتهایی educationalSteps — آفست از انتهای آرایه
                const isStudying = (currentPath === 'studying');
                const stepKey = isStudying ? 'educationalSteps' : stepKeyMap[currentPath];
                // برای studying، اندیس مرحله در educationalSteps = طول educationalSteps - طول STEPS.studying + stageIndex
                const studyingOffset = isStudying && Array.isArray(studentsData[studentId][stepKey])
                    ? studentsData[studentId][stepKey].length - STEPS.studying.length
                    : 0;
                const profileStepIndex = isStudying ? (studyingOffset + stageIndex) : stageIndex;
                let needSave = false;
                // اگر آرایه مراحل در students_data نبود، از وضعیت فعلی شیت بساز
                // تا تغییرات toggle در پروفایل دانشجو هم ذخیره شود
                if (stepKey && !Array.isArray(studentsData[studentId][stepKey])) {
                    studentsData[studentId][stepKey] = prog.map((p, idx) => ({
                        name: (STEPS[currentPath][idx] || `مرحله ${idx + 1}`),
                        completed: p.status === STATUS_COMPLETED,
                        paused:    p.status === STATUS_PAUSED,
                        date: p.status === STATUS_COMPLETED ? new Date().toLocaleDateString('fa-IR') : null
                    }));
                    needSave = true;
                }
                if (stepKey && Array.isArray(studentsData[studentId][stepKey]) && studentsData[studentId][stepKey][profileStepIndex] !== undefined) {
                    const newStatus = prog[stageIndex].status;
                    // 2=تکمیل شده | 0,1,3=تکمیل نشده (3=متوقف شده)
                    studentsData[studentId][stepKey][profileStepIndex].completed = (newStatus === STATUS_COMPLETED);
                    studentsData[studentId][stepKey][profileStepIndex].paused    = (newStatus === STATUS_PAUSED);
                    if (newStatus === STATUS_COMPLETED) {
                        studentsData[studentId][stepKey][profileStepIndex].date = new Date().toLocaleDateString('fa-IR');
                    } else {
                        studentsData[studentId][stepKey][profileStepIndex].date = null;
                    }
                    needSave = true;
                }
                if (needSave) {
                    localStorage.setItem('students_data', JSON.stringify(studentsData));
                    // ── sync وضعیت پروفایل به Supabase ─────────────────────
                    // مسیر ۱: StudentsSync والد (اگر داخل iframe صفحهٔ اصلی باشیم)
                    let syncedByParent = false;
                    try {
                        if (window.parent && window.parent !== window &&
                            window.parent.StudentsSync &&
                            typeof window.parent.StudentsSync.syncStudent === 'function') {
                            window.parent.StudentsSync.syncStudent(studentId, studentsData[studentId]);
                            syncedByParent = true;
                        }
                    } catch(e2) { /* cross-origin — ادامه */ }

                    // مسیر ۲: مستقیم از خود شیت (وقتی StudentsSync والد نیست —
                    // شیت مستقل باز شده یا ماژول‌هایش اینجا لود شده‌اند)
                    // students_data → student_progress (سه مسیر) + profiles.current_path/active
                    if (!syncedByParent) {
                        try {
                            const sb = _sheetSb();
                            if (sb) {
                                const sData = studentsData[studentId];
                                // نگهداشت وضعیت واقعی شیت (0|1|2|3) — به‌جای فشرده‌سازی به 0|2
                                // (قبلاً status=1 و 3 اینجا نابود می‌شد و از بین می‌رفت)
                                const stepsToProgress = (arr) => {
                                    if (!Array.isArray(arr)) return null;
                                    const names = STEPS[arguments.length > 1 ? arguments[1] : null] || null;
                                    return arr.map(s => {
                                        if (!s) return { status: 0 };
                                        if (s.status !== undefined) return { status: s.status };
                                        if (s.completed) return { status: 2 };
                                        if (s.paused)    return { status: 3 };
                                        return { status: 0 };
                                    });
                                };
                                // مسیر studying → progress مستقل با path_type='studying'
                                // (خطای CHECK constraint در DB یعنی supabase/fix_studying_path.sql اجرا نشده)
                                const studyingProgress = (arr) => {
                                    if (!Array.isArray(arr)) return null;
                                    const names = STEPS.studying;
                                    const tail = arr.slice(-names.length);
                                    return names.map((_, i) => {
                                        const s = tail[i];
                                        if (!s) return { status: 0 };
                                        if (s.status !== undefined) return { status: s.status };
                                        if (s.completed) return { status: 2 };
                                        if (s.paused)    return { status: 3 };
                                        return { status: 0 };
                                    });
                                };
                                const jobs = [
                                    ['defense',      stepsToProgress(sData.defenseSteps)],
                                    ['educational',  stepsToProgress(sData.educationalSteps)],
                                    ['requirements', stepsToProgress(sData.requirementsSteps)],
                                    ['studying',     studyingProgress(sData.educationalSteps)],
                                ].filter(([, p]) => p && p.length > 0);
                                jobs.forEach(([pt, p]) =>
                                    sb.saveStudentProgress(studentId, pt, p)
                                        .catch(e => console.warn(`⚠️ sheet profile-sync [${pt}]:`, e.message)));

                                const client = (typeof getSupabaseClient === 'function')
                                    ? (typeof window.parent !== 'undefined' && window.parent.getSupabaseClient
                                        ? window.parent.getSupabaseClient() : getSupabaseClient())
                                    : null;
                                if (client) {
                                    const upd = {};
                                    if (sData.currentPath)  upd.current_path = sData.currentPath;
                                    if (sData.graduated !== undefined) upd.graduated = !!sData.graduated;
                                    if (sData.active !== undefined)    upd.active = !!sData.active;
                                    if (Object.keys(upd).length > 0) {
                                        client.from('profiles').update(upd).eq('id', studentId)
                                            .then(({ error }) => {
                                                if (error) console.warn('⚠️ sheet profiles sync:', error.message);
                                            });
                                    }
                                }
                            }
                        } catch(e2) { console.warn('⚠️ sheet direct profile sync:', e2); }
                    }
                }
            } catch(e) { console.warn('students_data sync error:', e); }

            // ── اگر وضعیت به "تکمیل شده" رسید، وظیفه مرحله بعدی را trigger کن
            if (prog[stageIndex].status === STATUS_COMPLETED && window.StepAssignmentModule) {
                try {
                    const studentsData = JSON.parse(localStorage.getItem('students_data') || '{}');
                    if (!studentsData[studentId]) {
                        studentsData[studentId] = { id: studentId, name: student.name, field: student.major };
                        localStorage.setItem('students_data', JSON.stringify(studentsData));
                    }
                    const nextStepName = STEPS[currentPath][stageIndex + 1] || '';
                    window.StepAssignmentModule.triggerNextStepTask(studentId, currentPath, stageIndex, { nextStepName });
                } catch(e) { console.warn('StepAssignment trigger error:', e); }
            }

            // آپدیت مسیر فعال بعد از تغییر وضعیت
            student._activePath = _getActivePath(student);

            renderTable();
        }
        
        function setFilter(f) {
            currentFilter = f;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`filter-${f}`).classList.add('active');
            renderTable();
        }
        
        function filterStudents() {
            searchTerm = document.getElementById('search-input').value;
            renderTable();
        }

        function exportToExcel() {
            if (!STEPS[currentPath]) return;
            const steps = STEPS[currentPath];
            let csv = 'نام,رشته,' + steps.join(',') + ',درصد\n';
            students.forEach(s => {
                const prog = s.progress[currentPath];
                const done = prog.filter(p => p.status === STATUS_COMPLETED).length;
                csv += `"${s.name}","${s.major}",`;
                csv += prog.map(p => p.status === STATUS_COMPLETED ? '✓' : p.status === STATUS_CURRENT ? '●' : '✗').join(',');
                csv += `,${Math.round((done / prog.length) * 100)}%\n`;
            });
            
            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `sheet-${currentPath}.csv`;
            a.click();
        }
    </script>
