name: Build Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:   # اجرای دستی از پنل GitHub Actions

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # ۱. دریافت کد
      - name: Checkout repository
        uses: actions/checkout@v4

      # ۲. نصب Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ۳. نصب Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      # ۴. نصب وابستگی‌ها
      - name: Install dependencies
        run: flutter pub get
        working-directory: flutter_app

      # ۵. ساخت آیکن اپ از لوگو
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
        working-directory: flutter_app

      # ۶. بررسی کد (اختیاری ولی مفید)
      - name: Analyze code
        run: flutter analyze --no-fatal-infos
        working-directory: flutter_app
        continue-on-error: true

      # ۷. ساخت APK release کم‌حجم (split per ABI)
      - name: Build release APK
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --target-platform android-arm64 \
            --obfuscate \
            --split-debug-info=build/debug-info
        working-directory: flutter_app

      # ۸. نمایش اطلاعات فایل‌های ساخته‌شده
      - name: List APK files
        run: |
          echo "=== APK files ==="
          find flutter_app/build/app/outputs/flutter-apk -name "*.apk" -exec ls -lh {} \;

      # ۹. آپلود APK به عنوان artifact (قابل دانلود از GitHub)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alkawsar-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/*-release.apk
          retention-days: 30

      # ۱۰. ساخت GitHub Release (فقط روی push به main)
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "الکوثر v${{ github.run_number }}"
          body: |
            ## نسخه جدید اپلیکیشن الکوثر

            ### نصب
            فایل APK را دانلود و روی گوشی اندروید نصب کنید.

            > **توجه:** قبل از نصب، گزینه "نصب از منابع ناشناس" را در تنظیمات فعال کنید.

            Build: ${{ github.sha }}
          files: flutter_app/build/app/outputs/flutter-apk/*-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
