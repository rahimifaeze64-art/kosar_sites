name: Build Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Generate launcher icons
        working-directory: flutter_app
        run: dart run flutter_launcher_icons

      # ic_launcher_round را از ic_launcher کپی کن (برای Android 7.1+)
      - name: Copy ic_launcher as ic_launcher_round
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            src="flutter_app/android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            dst="flutter_app/android/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
            if [ -f "$src" ]; then
              cp "$src" "$dst"
              echo "✓ copied mipmap-${density}/ic_launcher_round.png"
            fi
          done

      - name: Build release APK (arm64 only - smallest size)
        working-directory: flutter_app
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --target-platform android-arm64 \
            --no-tree-shake-icons

      - name: Show APK size
        run: |
          echo "=== APK files ==="
          find flutter_app/build/app/outputs/flutter-apk -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: alkawsar-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "الکوثر v1.0.${{ github.run_number }}"
          body: |
            ## دانلود اپلیکیشن الکوثر

            فایل APK را دانلود و روی گوشی اندروید نصب کنید.
            > قبل از نصب، گزینه **نصب از منابع ناشناس** را در تنظیمات فعال کنید.
          files: flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
