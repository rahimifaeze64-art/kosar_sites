name: Build Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Generate launcher icons
        working-directory: flutter_app
        run: dart run flutter_launcher_icons

      # لوگو را 2x زوم کن برای adaptive icon foreground
      - name: Create zoomed adaptive icon foreground
        run: |
          pip install Pillow --quiet
          python3 - <<'EOF'
          from PIL import Image
          import os

          src = "flutter_app/assets/icon.png"
          out = "flutter_app/assets/icon_foreground.png"

          img = Image.open(src).convert("RGBA")
          w, h = img.size

          # کانواس adaptive icon = 108dp، safe zone = 72dp مرکز
          # برای پر کردن safe zone لوگو رو 2x زوم می‌کنیم
          scale = 2.0
          new_w = int(w * scale)
          new_h = int(h * scale)

          # resize با کیفیت بالا
          zoomed = img.resize((new_w, new_h), Image.LANCZOS)

          # کانواس خروجی = اندازه اصلی (transparent)
          canvas = Image.new("RGBA", (w, h), (0, 0, 0, 0))

          # مرکزکردن لوگوی بزرگ‌شده روی کانواس
          offset_x = (w - new_w) // 2
          offset_y = (h - new_h) // 2
          canvas.paste(zoomed, (offset_x, offset_y), zoomed)

          canvas.save(out)
          print(f"✓ icon_foreground.png saved ({w}x{h})")
          EOF

      # pubspec را به‌روز کن تا از foreground جدید استفاده کنه
      - name: Update pubspec for zoomed foreground
        run: |
          sed -i 's|adaptive_icon_foreground: "assets/icon.png"|adaptive_icon_foreground: "assets/icon_foreground.png"|' \
            flutter_app/pubspec.yaml

      # مجدداً آیکن‌ها را بساز با foreground بزرگ‌شده
      - name: Regenerate launcher icons with zoomed foreground
        working-directory: flutter_app
        run: dart run flutter_launcher_icons

      # ic_launcher_round را از ic_launcher کپی کن (برای Android 7.1+)
      - name: Copy ic_launcher as ic_launcher_round
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            src="flutter_app/android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            dst="flutter_app/android/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
            if [ -f "$src" ]; then
              cp "$src" "$dst"
              echo "✓ copied mipmap-${density}/ic_launcher_round.png"
            fi
          done

      - name: Build release APK (arm64 only - smallest size)
        working-directory: flutter_app
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --target-platform android-arm64 \
            --no-tree-shake-icons

      - name: Show APK size
        run: |
          echo "=== APK files ==="
          find flutter_app/build/app/outputs/flutter-apk -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: alkawsar-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "الکوثر v1.0.${{ github.run_number }}"
          body: |
            ## دانلود اپلیکیشن الکوثر

            فایل APK را دانلود و روی گوشی اندروید نصب کنید.
            > قبل از نصب، گزینه **نصب از منابع ناشناس** را در تنظیمات فعال کنید.
          files: flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
