    <meta http-equiv="Expires" content="0">
    <!-- Service Worker را غیرفعال می‌کنیم تا cache قدیمی مشکل نسازه -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                registrations.forEach(function(reg) { reg.unregister(); });
            });
        }
    </script>
    <title>سیستم مدیریت تحصیلی دانشجویان بین‌المللی</title>

    <!-- اگر لاگین نیست → صفحه اصلی سایت -->
    <script>
        (function() {
            var saved = localStorage.getItem('currentUser');
            if (!saved) { window.location.replace('landing.html'); return; }
            try {
                var u = JSON.parse(saved);
                if (!u || !u.id || !u.role) {
                    localStorage.removeItem('currentUser');
                    window.location.replace('landing.html');
                }
            } catch(e) {
                localStorage.removeItem('currentUser');
                window.location.replace('landing.html');
            }
        })();
    </script>

    <!-- Scripts -->
    <script>
        // Debug System
        let debugLog = [];
        let debugVisible = false;
        
        // Safe debug logger
        function debugLogger(message, type = 'info', data = null) {
            try {
                const timestamp = new Date().toLocaleTimeString('fa-IR');
                const logEntry = {
                    timestamp,
                    message,
                    type,
                    data: data ? JSON.stringify(data, null, 2) : null
                };
                
                debugLog.push(logEntry);
                
                // Console log
                console.log(`[${timestamp}] ${type.toUpperCase()}: ${message}`, data || '');
                
                // Update debug panel if visible
                if (debugVisible) {
                    updateDebugPanel();
                }
                
                // Keep only last 100 entries
                if (debugLog.length > 100) {
                    debugLog = debugLog.slice(-100);
                }
            } catch (error) {
                console.error('Debug logger error:', error);
            }
        }
        
        function updateDebugPanel() {
            const content = document.getElementById('debug-content');
            if (!content) return;
            
            content.innerHTML = debugLog.slice(-20).reverse().map(entry => {
                const typeColors = {
                    info: 'text-black-400',
                    success: 'text-green-400',
                    warning: 'text-lime-400',
                    error: 'text-red-400'
                };
                
                return `
                    <div class="border-b border-gray-700 pb-1 mb-1">
                        <div class="flex justify-between">
                            <span class="${typeColors[entry.type] || 'text-gray-400'}">[${entry.type}]</span>
                            <span class="text-gray-500">${entry.timestamp}</span>
                        </div>
                        <div class="text-white">${entry.message}</div>
                        ${entry.data ? `<pre class="text-gray-300 text-xs mt-1 bg-gray-800 p-1 rounded overflow-x-auto">${entry.data}</pre>` : ''}
                    </div>
                `;
            }).join('');
        }
        
        function toggleDebug() {
            const panel = document.getElementById('debug-panel');
            debugVisible = !debugVisible;
            panel.style.display = debugVisible ? 'block' : 'none';
            
            if (debugVisible) {
                updateDebugPanel();
            }
        }
        
        function clearDebugLog() {
            debugLog = [];
            updateDebugPanel();
            debugLogger('Debug log cleared', 'info');
        }
        
        function exportDebugLog() {
            const dataStr = JSON.stringify(debugLog, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `debug-log-${new Date().toISOString().slice(0,19)}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }
        
        function resetAllData() {
            if (confirm('آیا مطمئن هستید؟ تمام داده‌ها پاک و با داده‌های پیش‌فرض جایگزین می‌شوند.')) {
                localStorage.removeItem(CONFIG.STORAGE_KEYS.USERS);
                localStorage.removeItem(CONFIG.STORAGE_KEYS.ORDERS);
                localStorage.removeItem(CONFIG.STORAGE_KEYS.CURRENT_USER);
                debugLogger('All data reset to defaults', 'success');
                setTimeout(() => location.reload(), 500);
            }
        }
        
        // Override console methods to capture errors
        const originalError = console.error;
        console.error = function(...args) {
            debugLogger(`Console Error: ${args.join(' ')}`, 'error', args);
            originalError.apply(console, args);
        };
        
        const originalWarn = console.warn;
        console.warn = function(...args) {
            debugLogger(`Console Warning: ${args.join(' ')}`, 'warning', args);
            originalWarn.apply(console, args);
        };
        
        // Catch unhandled errors
        window.addEventListener('error', function(e) {
            debugLogger(`Unhandled Error: ${e.message}`, 'error', {
                filename: e.filename,
                lineno: e.lineno,
                colno: e.colno,
                stack: e.error?.stack
            });
        });
        
        // Catch unhandled promise rejections
        window.addEventListener('unhandledrejection', function(e) {
            debugLogger(`Unhandled Promise Rejection: ${e.reason}`, 'error', e.reason);
        });
        
        // Initial debug message
        debugLogger('Debug system initialized', 'success');
    </script>
    <!-- ═══ تخصیص کارمند به حسابداری کارمندان ═══ -->
    <script>
        // ── پارامترهای Supabase (مستقل از supabase-config.js) ──
        var _SB_URL = 'https://cikwuctdkatcxwzwxvff.supabase.co';
        var _SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpa3d1Y3Rka2F0Y3h3end4dmZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2NzY1MzcsImV4cCI6MjA5OTI1MjUzN30.HiOMF3J4DSR21qreVrlhCxdXjshzOidhvwv96CeJDd8';
        var _sbHeaders = { 'apikey': _SB_KEY, 'Authorization': 'Bearer ' + _SB_KEY, 'Content-Type': 'application/json' };

        // ── storage: work_hours config row (id='__emp_acc_config__') ──
        // چون جدول app_settings نداره، از work_hours.description استفاده می‌کنیم
        var _EMP_ACC_ROW = '__emp_acc_config__';

        // همیشه جدول موجوده (work_hours)
        async function _checkAppSettingsTable() { return true; }

        // خواندن empAccAllowedIds از work_hours config row
        async function _fetchEmpAccAllowedIds() {
            try {
                var res = await fetch(
                    _SB_URL + '/rest/v1/work_hours?id=eq.' + _EMP_ACC_ROW + '&select=description',
                    { headers: _sbHeaders }
                );
                if (res.ok) {
                    var rows = await res.json();
                    if (rows && rows.length > 0 && rows[0].description) {
                        var parsed = JSON.parse(rows[0].description);
                        var ids = Array.isArray(parsed.empAccAllowedIds) ? parsed.empAccAllowedIds : [];
                        localStorage.setItem('empAccAllowedIds', JSON.stringify(ids));
                        console.log('✅ empAccAllowedIds از Supabase خوانده شد:', ids);
                        return ids;
                    }
                }
            } catch(e) { console.warn('_fetchEmpAccAllowedIds خطا:', e.message); }
            // fallback به localStorage
            try { return JSON.parse(localStorage.getItem('empAccAllowedIds') || '[]'); } catch(e) { return []; }
        }

        // ذخیره empAccAllowedIds در work_hours config row
        async function _saveEmpAccToSupabase(ids) {
            try {
                var descVal = JSON.stringify({ empAccAllowedIds: ids });
                // PATCH اگه row وجود داره، POST اگه نداره
                var patchRes = await fetch(
                    _SB_URL + '/rest/v1/work_hours?id=eq.' + _EMP_ACC_ROW,
                    {
                        method: 'PATCH',
                        headers: Object.assign({}, _sbHeaders, { 'Prefer': 'return=representation' }),
                        body: JSON.stringify({ description: descVal, updated_at: new Date().toISOString() })
                    }
                );
                if (patchRes.ok) {
                    var patched = await patchRes.json();
                    if (patched && patched.length > 0) {
                        console.log('✅ empAccAllowedIds در Supabase ذخیره شد:', ids);
                        return true;
                    }
                }
                // row نبود — POST کن
                var postRes = await fetch(
                    _SB_URL + '/rest/v1/work_hours?on_conflict=id',
                    {
                        method: 'POST',
                        headers: Object.assign({}, _sbHeaders, { 'Prefer': 'resolution=merge-duplicates,return=representation' }),
                        body: JSON.stringify({
                            id: _EMP_ACC_ROW, employee_id: '__system__', employee_name: 'SYSTEM_CONFIG',
                            type: 'work', date: '2000-01-01', description: descVal, status: 'approved'
                        })
                    }
                );
                if (postRes.ok || postRes.status === 201) {
                    console.log('✅ empAccAllowedIds (new row) در Supabase ذخیره شد:', ids);
                    return true;
                }
                console.warn('⚠️ ذخیره در Supabase ناموفق — status:', postRes.status);
                return false;
            } catch(e) {
                console.warn('⚠️ ذخیره در Supabase خطا:', e.message);
                return false;
            }
        }

        // لیست کارمندان از HARDCODED_USERS — بعد از لود اسکریپت‌ها
        function _getEmployeesForAssign() {
            try {
                if (typeof HARDCODED_USERS !== 'undefined') {
                    return HARDCODED_USERS.filter(u => u.role === 'employee' && u.active);
                }
            } catch(e) {}
            return [
                { id: 'emp001', name: 'سارا سادات حسینی' },
                { id: 'emp002', name: 'زینب بتول محمدی' },
                { id: 'emp003', name: 'علیرضا غلامی فرزاد' },
                { id: 'emp004', name: 'سید محمد فاضلی' },
                { id: 'emp005', name: 'مهدی خدایاری' },
            ];
        }

        function openEmpAccAssignModal() {
            var modal = document.getElementById('emp-acc-assign-modal');
            var list  = document.getElementById('emp-acc-assign-list');
            if (!modal || !list) return;

            // نمایش مودال فوری با لودینگ
            list.innerHTML = '<div class="text-center text-gray-400 py-4"><i class="fas fa-spinner fa-spin ml-2"></i>در حال بارگذاری...</div>';
            modal.style.display = 'flex';

            // خواندن از Supabase و رندر لیست
            _fetchEmpAccAllowedIds().then(function(allowed) {
                var employees = _getEmployeesForAssign();
                list.innerHTML = employees.map(function(emp) {
                    var checked = allowed.includes(emp.id) ? 'checked' : '';
                    return '<label class="flex items-center gap-3 p-3 rounded-xl bg-slate-700 hover:bg-slate-600 cursor-pointer transition-colors">'
                        + '<input type="checkbox" value="' + emp.id + '" ' + checked
                        + ' class="w-4 h-4 accent-green-500 flex-shrink-0">'
                        + '<div class="w-8 h-8 rounded-full bg-green-500/30 flex items-center justify-center text-green-300 font-bold text-sm flex-shrink-0">'
                        + emp.name.charAt(0)
                        + '</div>'
                        + '<span class="text-white font-medium text-sm">' + emp.name + '</span>'
                        + '</label>';
                }).join('');
            });

            modal.style.display = 'flex';
        }

        function closeEmpAccAssignModal() {
            var modal = document.getElementById('emp-acc-assign-modal');
            if (modal) modal.style.display = 'none';
        }

        // ── تابع مرکزی برای آپدیت empAccAllowedIds ──
        // این تنها راه مطمئن برای آپدیت Alpine state از بیرون است
        window.setEmpAccAllowedIds = function(ids) {
            ids = Array.isArray(ids) ? ids : [];
            localStorage.setItem('empAccAllowedIds', JSON.stringify(ids));
            // Alpine از طریق CustomEvent آپدیت می‌شه — بدون دستکاری مستقیم state
            window.dispatchEvent(new CustomEvent('emp-acc-updated', { detail: { ids: ids } }));
            console.log('✅ empAccAllowedIds آپدیت شد:', ids);
        };

        function saveEmpAccAssign() {
            var list = document.getElementById('emp-acc-assign-list');
            if (!list) return;

            var selected = Array.from(list.querySelectorAll('input[type=checkbox]:checked'))
                .map(function(cb) { return cb.value; });

            // آپدیت مرکزی — Alpine state + localStorage + event
            window.setEmpAccAllowedIds(selected);

            // sync با Supabase از طریق fetch مستقیم
            _saveEmpAccToSupabase(selected).then(function(ok) {
                if (!ok) {
                    // fallback به SupabaseDataModule اگه موجود بود
                    if (typeof SupabaseDataModule !== 'undefined' &&
                        typeof SupabaseDataModule.syncEmpAccAllowedIds === 'function') {
                        SupabaseDataModule.syncEmpAccAllowedIds(selected).catch(function(e) {
                            console.warn('Supabase sync error:', e);
                        });
                    }
                }
            });

            closeEmpAccAssignModal();

            // toast تأیید
            var t = document.createElement('div');
            t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#4f46e5;color:#fff;padding:12px 24px;border-radius:12px;font-family:Vazirmatn,sans-serif;font-size:14px;z-index:9999;direction:rtl;box-shadow:0 4px 20px rgba(0,0,0,.3);';
            t.textContent = selected.length > 0
                ? '✅ دسترسی ' + selected.length + ' کارمند ذخیره شد'
                : '✅ دسترسی همه کارمندان لغو شد';
            document.body.appendChild(t);
            setTimeout(function() { t.remove(); }, 3000);
        }

        // بستن مودال با کلیک خارج از آن
        document.addEventListener('click', function(e) {
            var modal = document.getElementById('emp-acc-assign-modal');
            if (modal && modal.style.display === 'flex' && e.target === modal) {
                closeEmpAccAssignModal();
            }
        });
    </script>

    <!-- ═══ Dynamic Script Loader — همیشه آخرین نسخه ═══ -->
    <script>
    (function() {
        var ts = window._APP_TS || Date.now();
        var scripts = window._APP_SCRIPTS || [];
        // بارگذاری sync (document.write فقط قبل از DOMContentLoaded کار می‌کنه)
        scripts.forEach(function(src) {
            document.write('<script src="' + src + '?v=' + ts + '"><\/script>');
        });
    })();
    </script>
